<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Gold Sprint</title>

    <link rel="stylesheet" href="/style.css?v=16">
</head>

<body>

    <div id="app">

        <!-- RACE -->

        <section id="race-screen" class="screen">

            <header class="topbar">
                <div class="logo">
                    GOLD SPRINT TROPINKA
                </div>
            </header>


            <div id="race-heat" class="race-heat hidden"></div>


            <div class="race-status">

                <div id="status">
                    READY
                </div>

            </div>


            <div class="riders">

                <!-- RIDER 01 -->

                <div class="rider rider-1">

                    <div class="rider-name" id="rider-name-1">
                        RIDER 01
                    </div>

                    <div class="speed">
                        <span id="speed-1">0.0</span>
                        <small>KM/H</small>
                    </div>

                    <div class="progress">
                        <div id="progress-1"></div>
                    </div>

                    <div class="distance">
                        <span id="distance-1">0.0</span>
                        <small>
                            / <span id="distance-limit-1">250</span> M
                        </small>
                    </div>

                    <div class="cadence">
                        <span id="cadence-1">0</span>
                        <small>RPM</small>
                    </div>

                </div>


                <!-- RIDER 02 -->

                <div class="rider rider-2">

                    <div class="rider-name" id="rider-name-2">
                        RIDER 02
                    </div>

                    <div class="speed">
                        <span id="speed-2">0.0</span>
                        <small>KM/H</small>
                    </div>

                    <div class="progress">
                        <div id="progress-2"></div>
                    </div>

                    <div class="distance">
                        <span id="distance-2">0.0</span>
                        <small>
                            / <span id="distance-limit-2">250</span> M
                        </small>
                    </div>

                    <div class="cadence">
                        <span id="cadence-2">0</span>
                        <small>RPM</small>
                    </div>

                </div>

            </div>


            <button id="start-button" class="main-button">
                START
            </button>

        </section>


        <!-- SETUP -->

        <section id="setup-screen" class="screen hidden">

            <header class="topbar">

                <button id="back-button" class="icon-button">
                    ←
                </button>

                <div class="screen-title">
                    SETUP
                </div>

                <div></div>

            </header>


            <div class="setup-content">

                <div class="section-title">
                    RACE
                </div>


                <div class="setting-row">

                    <div>
                        <div class="setting-name">
                            DISTANCE
                        </div>

                        <div class="setting-description">
                            Race distance
                        </div>
                    </div>

                    <select id="setup-distance">

                        <option value="10">
                            10 M
                        </option>

                        <option value="100">
                            100 M
                        </option>

                        <option value="250" selected>
                            250 M
                        </option>

                        <option value="500">
                            500 M
                        </option>

                        <option value="666">
                            666 M
                        </option>

                        <option value="1000">
                            1000 M
                        </option>

                    </select>

                </div>


                <div class="section-title">
                    WHEEL
                </div>


                <!-- RIDER 01 -->

                <div class="rider-setting">

                    <div class="rider-setting-title">
                        RIDER 01
                    </div>

                    <div class="wheel-input">

                        <input id="wheel-1" type="number" value="2105" min="1000" max="3000">

                        <span>MM</span>

                    </div>

                    <div class="wheel-description">
                        Wheel circumference
                    </div>

                </div>


                <!-- RIDER 02 -->

                <div class="rider-setting">

                    <div class="rider-setting-title">
                        RIDER 02
                    </div>

                    <div class="wheel-input">

                        <input id="wheel-2" type="number" value="2105" min="1000" max="3000">

                        <span>MM</span>

                    </div>

                    <div class="wheel-description">
                        Wheel circumference
                    </div>

                </div>


                <button id="save-settings" class="main-button">
                    SAVE
                </button>

            </div>

        </section>


        <!-- TOURNAMENT -->

        <section id="tournament-screen" class="screen hidden">

            <header class="topbar">
                <div></div>
                <div class="screen-title">
                    TOURNAMENT
                </div>
                <div></div>
            </header>

            <div id="tournament-body"></div>

        </section>


        <!-- NAVIGATION -->

        <nav class="navigation">

            <button id="nav-race" class="nav-item active">
                <span>■</span>
                RACE
            </button>

            <button id="nav-tournament" class="nav-item">
                <span>◇</span>
                TOURNAMENT
            </button>

            <button id="nav-setup" class="nav-item">
                <span>⚙</span>
                SETUP
            </button>

        </nav>


        <!-- TOURNAMENT SIDEBAR (standings, shown during a tournament) -->

        <aside id="tournament-sidebar" class="hidden"></aside>


        <!-- OVERLAY (countdown / result) -->

        <div id="overlay" class="overlay hidden">

            <div id="overlay-countdown"></div>

            <div id="overlay-result" class="hidden">

                <div class="overlay-result-label" id="overlay-result-label">
                    WINNER
                </div>

                <div id="overlay-result-rider"></div>

                <div id="overlay-result-time"></div>

                <div class="overlay-result-hint">
                    TAP TO CONTINUE
                </div>

            </div>

        </div>

    </div>


    <script src="/app.js?v=16"></script>

</body>

</html>
